name: Local Activation Migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply local activation migration
        env:
          ACTIVATION_HASH: '$2y$12$C3FkK1exrKc2UY/5MTVoIuvwz2eAyAFbmHSHQBbL8AKzVj1pEUCyS'
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, content):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          p = 'application/core/MY_Controller.php'
          s = read(p)
          assert "        $this->check_license();" in s
          s = s.replace("        $this->check_license();", """        $this->load->library('local_activation');
        $active_class  = $this->router->fetch_class();
        $active_method = $this->router->fetch_method();

        if (!$this->local_activation->is_activated()
            && !($active_class === 'admin' && in_array($active_method, array('activation', 'activate'), true))) {
            redirect('admin/admin/activation');
            return;
        }""")
          pattern = re.compile(r"\n    public function check_license\(\)\n    \{.*?\n    \}\n\n    public function update_ss_routine\(\)\n    \{.*?\n    \}\n", re.S)
          s, n = pattern.subn('\n', s, count=1)
          assert n == 1
          write(p, s)

          p = 'application/controllers/admin/Admin.php'
          s = read(p)
          pattern = re.compile(r"\n    public function updatePurchaseCode\(\)\n    \{.*?\n    \}\n", re.S)
          replacement = r'''
    public function activation()
    {
        $data['is_activated'] = $this->local_activation->is_activated();
        $data['activation_status'] = $this->local_activation->get_status();
        $this->load->view('layout/header', $data);
        $this->load->view('admin/activation/index', $data);
        $this->load->view('layout/footer', $data);
    }

    public function activate()
    {
        $this->form_validation->set_rules('activation_code', 'Activation Code', 'required|trim|xss_clean');

        if ($this->form_validation->run() === false) {
            $this->session->set_flashdata('activation_error', validation_errors());
            redirect('admin/admin/activation');
            return;
        }

        $code = $this->input->post('activation_code', true);

        if ($this->local_activation->activate($code)) {
            $this->session->set_flashdata('activation_success', 'Application activated successfully.');
        } else {
            $this->session->set_flashdata('activation_error', 'Invalid Activation Code');
        }

        redirect('admin/admin/activation');
    }
'''
          s, n = pattern.subn('\n' + replacement, s, count=1)
          assert n == 1
          write(p, s)

          p = 'application/views/layout/header.php'
          s = read(p)
          s = s.replace('            var chk_validate="<?php echo $this->config->item(\'SSLK\') ?>";\n', '')
          alert_pattern = re.compile(r"\n<\?php\nif \(\$this->config->item\('SSLK'\) == \"\"\) \{.*?\n\?>\n", re.S)
          s, n = alert_pattern.subn('\n', s, count=1)
          assert n == 1
          marker = '<ul class="nav navbar-nav headertopmenu">'
          assert marker in s
          status_link = '''<ul class="nav navbar-nav headertopmenu">\n                                    <li class="cal15" data-placement="bottom" data-toggle="tooltip" title="Application Activation"><a href="<?php echo site_url('admin/admin/activation'); ?>"><i class="fa fa-key"></i></a></li>'''
          s = s.replace(marker, status_link, 1)
          write(p, s)

          write('backend/js/school-admin-custom.js', "$(document).ready(function() {\n    // Local activation is handled server-side.\n});\n")

          old_modal = root / 'application/views/layout/routine_update.php'
          if old_modal.exists():
              old_modal.unlink()

          write('application/config/local_activation.php', '''<?php\n\nif (!defined('BASEPATH')) {\n    exit('No direct script access allowed');\n}\n\n$config['local_activation_code_hash'] = '$2y$12$C3FkK1exrKc2UY/5MTVoIuvwz2eAyAFbmHSHQBbL8AKzVj1pEUCyS';\n''')

          write('application/libraries/Local_activation.php', '''<?php\n\nif (!defined('BASEPATH')) {\n    exit('No direct script access allowed');\n}\n\nclass Local_activation\n{\n    protected $CI;\n    protected $table = 'local_activation';\n\n    public function __construct()\n    {\n        $this->CI = &get_instance();\n        $this->CI->load->database();\n        $this->CI->config->load('local_activation');\n        $this->ensure_table();\n    }\n\n    protected function table_name()\n    {\n        return $this->CI->db->dbprefix($this->table);\n    }\n\n    protected function ensure_table()\n    {\n        $table = $this->table_name();\n        $sql = "CREATE TABLE IF NOT EXISTS `{$table}` (\n            `id` tinyint unsigned NOT NULL,\n            `is_activated` tinyint(1) NOT NULL DEFAULT 0,\n            `activated_at` datetime NULL DEFAULT NULL,\n            PRIMARY KEY (`id`)\n        ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci";\n        $this->CI->db->query($sql);\n    }\n\n    protected function get_record()\n    {\n        return $this->CI->db->where('id', 1)->limit(1)->get($this->table)->row_array();\n    }\n\n    public function is_activated()\n    {\n        $record = $this->get_record();\n        return !empty($record) && (int) $record['is_activated'] === 1;\n    }\n\n    public function get_status()\n    {\n        $record = $this->get_record();\n        return array(\n            'active' => !empty($record) && (int) $record['is_activated'] === 1,\n            'activated_at' => !empty($record['activated_at']) ? $record['activated_at'] : null,\n        );\n    }\n\n    public function activate($activation_code)\n    {\n        $configured_hash = $this->CI->config->item('local_activation_code_hash');\n        if (!is_string($configured_hash) || $configured_hash === '') {\n            return false;\n        }\n\n        $activation_code = trim((string) $activation_code);\n        if ($activation_code === '' || !password_verify($activation_code, $configured_hash)) {\n            return false;\n        }\n\n        $record = $this->get_record();\n        $data = array('is_activated' => 1, 'activated_at' => date('Y-m-d H:i:s'));\n\n        if (!empty($record)) {\n            return $this->CI->db->where('id', 1)->update($this->table, $data);\n        }\n\n        $data['id'] = 1;\n        return $this->CI->db->insert($this->table, $data);\n    }\n}\n''')

          p = 'application/libraries/Auth.php'
          s = read(p)
          pattern = re.compile(r"\n    public function app_update\(\)\n    \{.*?\n    \}\n\n    public function addon_update_check", re.S)
          s, n = pattern.subn('\n    public function addon_update_check', s, count=1)
          assert n == 1
          write(p, s)

          p = 'application/libraries/Aes.php'
          s = read(p)
          pattern = re.compile(r"\n    function validchk\(\$action, \$string\)\n    \{.*?\n    \}\n", re.S)
          s, n = pattern.subn('\n', s, count=1)
          assert n == 1
          write(p, s)

          p = 'application/config/constants.php'
          s = read(p)
          lines = [line for line in s.splitlines(True) if 'DEBUG_SYSTEM_UPDATE' not in line]
          assert len(lines) < len(s.splitlines(True))
          write(p, ''.join(lines))

          php_files = [
              'application/core/MY_Controller.php',
              'application/controllers/admin/Admin.php',
              'application/views/layout/header.php',
              'application/config/local_activation.php',
              'application/libraries/Local_activation.php',
              'application/libraries/Auth.php',
              'application/libraries/Aes.php',
              'application/config/constants.php',
          ]
          for f in php_files:
              subprocess.run(['php', '-l', f], check=True)

          workflow = root / '.github/workflows/local-activation-migration.yml'
          if workflow.exists():
              workflow.unlink()

          subprocess.run(['git', 'config', 'user.name', 'ChatGPT'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Replace remote licensing with local activation'], check=True)
          subprocess.run(['git', 'push', 'origin', 'main'], check=True)
          PY
# trigger retry
